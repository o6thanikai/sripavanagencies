<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Pavan Agencies — Gulf Oil, Tyres &amp; Spare Parts | Pudukkottai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gulf-blue:#0F4C81;
  --gulf-blue-dark:#0A3A63;
  --gulf-orange:#E8590C;
  --gulf-orange-light:#FF7A29;
  --ink:#12161C;
  --paper:#F6F4EF;
  --paper-2:#EFEBE2;
  --steel:#5B6774;
  --steel-light:#8B95A1;
  --success:#1E8E5A;
  --danger:#D64545;
  --white:#FFFFFF;
  --radius:10px;
  --shadow:0 4px 16px rgba(18,22,28,.08);
  --shadow-lg:0 12px 32px rgba(18,22,28,.16);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4,.display{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.3px;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none;}
input,select,textarea{font-family:inherit;}
img{max-width:100%; display:block;}

/* ---------- stripe motif (Gulf livery signature) ---------- */
.stripes{
  height:6px;
  background:repeating-linear-gradient(115deg,
    var(--gulf-blue) 0 28px,
    var(--gulf-orange) 28px 34px,
    var(--gulf-blue) 34px 62px,
    var(--white) 62px 66px);
}
.stripes.thin{height:4px;}

/* ---------- top bar ---------- */
.topbar{
  background:var(--gulf-blue);
  color:var(--white);
  padding:10px 24px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:13px;
}
.topbar .addr{color:#CFE1F0;}
.topbar .phone{font-family:'JetBrains Mono',monospace; font-weight:600;}

.brandbar{
  background:var(--white);
  padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow);
  position:sticky; top:0; z-index:50;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:46px; height:46px; border-radius:8px;
  background:linear-gradient(135deg,var(--gulf-blue),var(--gulf-blue-dark));
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  flex-shrink:0;
}
.brand-mark::after{
  content:"";
  position:absolute; width:14px; height:200%; background:var(--gulf-orange);
  transform:rotate(30deg); left:14px; top:-50%;
}
.brand-mark span{color:#fff; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; z-index:1;}
.brand-text h1{font-size:20px; color:var(--gulf-blue); line-height:1;}
.brand-text p{font-size:11px; color:var(--steel); text-transform:uppercase; letter-spacing:1.2px; margin-top:2px;}

.navlinks{display:flex; gap:4px; align-items:center;}
.navlinks button{
  background:transparent; color:var(--ink); font-weight:600; font-size:14px;
  padding:9px 16px; border-radius:8px; transition:.15s;
}
.navlinks button:hover{background:var(--paper-2);}
.navlinks button.active{background:var(--gulf-blue); color:#fff;}
.nav-badge{
  background:var(--gulf-orange); color:#fff; font-size:10px; font-weight:700;
  border-radius:20px; padding:1px 6px; margin-left:6px;
}
.user-chip{display:flex; align-items:center; gap:10px;}
.user-chip .role{
  font-size:10px; text-transform:uppercase; letter-spacing:1px; font-weight:700;
  background:var(--paper-2); padding:3px 9px; border-radius:20px; color:var(--gulf-blue);
}
.btn-logout{background:transparent; color:var(--danger); font-weight:600; font-size:13px; padding:8px 12px;}
.btn-logout:hover{text-decoration:underline;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 20px; border-radius:8px; font-weight:600; font-size:14px; transition:.15s;
}
.btn-primary{background:var(--gulf-orange); color:#fff;}
.btn-primary:hover{background:var(--gulf-orange-light); transform:translateY(-1px);}
.btn-secondary{background:var(--gulf-blue); color:#fff;}
.btn-secondary:hover{background:var(--gulf-blue-dark);}
.btn-outline{background:#fff; color:var(--gulf-blue); border:1.5px solid var(--gulf-blue);}
.btn-outline:hover{background:var(--paper-2);}
.btn-ghost{background:transparent; color:var(--steel);}
.btn-ghost:hover{color:var(--ink);}
.btn-danger{background:#fdeaea; color:var(--danger);}
.btn-danger:hover{background:var(--danger); color:#fff;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:6px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ---------- layout ---------- */
.container{max-width:1240px; margin:0 auto; padding:0 24px;}
.page{padding:32px 24px 80px; max-width:1240px; margin:0 auto;}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
.page-head h2{font-size:28px; color:var(--ink);}
.page-head p{color:var(--steel); font-size:14px; margin-top:4px;}
.eyebrow{
  font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--gulf-orange); margin-bottom:6px;
}

/* ---------- auth ---------- */
.auth-wrap{
  min-height:calc(100vh - 0px);
  display:flex; align-items:stretch;
}
.auth-visual{
  flex:1.1; background:linear-gradient(160deg,var(--gulf-blue) 0%,var(--gulf-blue-dark) 100%);
  color:#fff; padding:60px 56px; display:flex; flex-direction:column; justify-content:space-between;
  position:relative; overflow:hidden;
}
.auth-visual::before{
  content:""; position:absolute; right:-120px; top:-120px; width:420px; height:420px; border-radius:50%;
  background:radial-gradient(circle,rgba(232,89,12,.35),transparent 70%);
}
.auth-visual .stripe-deco{
  position:absolute; right:-40px; bottom:-60px; width:340px; height:340px;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 22px, rgba(232,89,12,.35) 22px 28px, transparent 28px 50px);
  transform:rotate(0deg); border-radius:50%;
}
.auth-visual h2{font-size:38px; line-height:1.15; max-width:420px; position:relative;}
.auth-visual .tag{color:#CFE1F0; margin-top:14px; font-size:15px; max-width:380px; position:relative;}
.auth-stats{display:flex; gap:36px; position:relative;}
.auth-stats div b{font-size:26px; font-family:'Rajdhani',sans-serif; display:block;}
.auth-stats div span{font-size:12px; color:#CFE1F0;}
.auth-addr{position:relative; font-size:13px; color:#CFE1F0; line-height:1.6;}

.auth-form-side{
  flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; background:var(--white);
}
.auth-card{width:100%; max-width:400px;}
.auth-tabs{display:flex; background:var(--paper-2); border-radius:10px; padding:4px; margin-bottom:26px;}
.auth-tabs button{flex:1; padding:10px; border-radius:8px; font-weight:600; font-size:14px; background:transparent; color:var(--steel);}
.auth-tabs button.active{background:#fff; color:var(--gulf-blue); box-shadow:var(--shadow);}

.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink);}
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border:1.5px solid #E1DDD3; border-radius:8px; font-size:14px;
  background:var(--paper); transition:.15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--gulf-blue); background:#fff;
}
.field input.invalid, .field select.invalid{border-color:var(--danger); background:#fef6f6;}
.field .err{color:var(--danger); font-size:12px; margin-top:5px; display:none;}
.field .err.show{display:block;}
.field .hint{color:var(--steel-light); font-size:11.5px; margin-top:5px;}
.pw-wrap{position:relative;}
.pw-toggle{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:transparent; color:var(--steel); font-size:12px; font-weight:600;}
.form-msg{padding:11px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none;}
.form-msg.show{display:block;}
.form-msg.error{background:#fdeaea; color:var(--danger);}
.form-msg.success{background:#e8f6ee; color:var(--success);}
.auth-switch{text-align:center; margin-top:18px; font-size:13.5px; color:var(--steel);}
.auth-switch b{color:var(--gulf-blue); cursor:pointer;}

/* ---------- hero (shop) ---------- */
.hero{
  background:linear-gradient(120deg,var(--gulf-blue-dark),var(--gulf-blue));
  color:#fff; padding:52px 24px; position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(115deg, transparent 0 60px, rgba(232,89,12,.14) 60px 68px, transparent 68px 130px);
}
.hero-inner{max-width:1240px; margin:0 auto; position:relative;}
.hero h2{font-size:34px; max-width:560px; line-height:1.2;}
.hero p{color:#CFE1F0; margin-top:10px; max-width:480px; font-size:15px;}
.hero-search{margin-top:24px; display:flex; gap:10px; max-width:520px;}
.hero-search input{
  flex:1; padding:13px 16px; border-radius:8px; border:none; font-size:14px;
}
.hero-search input:focus{outline:2px solid var(--gulf-orange);}

/* ---------- category tabs ---------- */
.cat-tabs{display:flex; gap:10px; padding:22px 24px 0; max-width:1240px; margin:0 auto; flex-wrap:wrap;}
.cat-tabs button{
  padding:10px 18px; border-radius:24px; background:#fff; border:1.5px solid #E1DDD3; font-weight:600; font-size:13.5px; color:var(--steel);
}
.cat-tabs button.active{background:var(--ink); color:#fff; border-color:var(--ink);}

/* ---------- product grid ---------- */
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; padding:24px; max-width:1240px; margin:0 auto;
}
.card-product{
  background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); transition:.2s;
  display:flex; flex-direction:column; position:relative; border:1px solid #ECE8DE;
}
.card-product:hover{box-shadow:var(--shadow-lg); transform:translateY(-3px);}
.card-img{
  height:150px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; position:relative;
}
.card-img img{width:100%; height:100%; object-fit:cover;}
.discount-tag{
  position:absolute; top:10px; left:10px; background:var(--gulf-orange); color:#fff; font-size:11px; font-weight:700;
  padding:4px 9px; border-radius:20px;
}
.fav-btn{
  position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.92);
  display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:var(--shadow);
}
.fav-btn.active{color:var(--danger);}
.card-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
.cat-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--gulf-blue); font-weight:700;}
.card-body h4{font-size:15.5px; line-height:1.3; min-height:40px;}
.stock-line{font-size:11.5px; color:var(--steel);}
.stock-line.low{color:var(--danger); font-weight:600;}
.price-row{display:flex; align-items:baseline; gap:8px; margin-top:auto;}
.price-now{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:var(--ink);}
.price-old{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--steel-light); text-decoration:line-through;}
.card-actions{display:flex; gap:8px; margin-top:6px;}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(18,22,28,.55); display:none; align-items:center; justify-content:center;
  z-index:200; padding:20px;
}
.overlay.show{display:flex;}
.modal{background:#fff; border-radius:14px; max-width:840px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);}
.modal-close{position:absolute; top:16px; right:16px; background:rgba(255,255,255,.9); width:34px; height:34px; border-radius:50%; font-size:18px;}
.pd-wrap{display:grid; grid-template-columns:1fr 1fr; gap:0;}
.pd-img{background:var(--paper-2); min-height:320px; display:flex; align-items:center; justify-content:center; position:relative;}
.pd-img img{width:100%; height:100%; object-fit:cover;}
.pd-info{padding:32px; display:flex; flex-direction:column; gap:14px;}
.pd-info h3{font-size:24px;}
.pd-desc{color:var(--steel); font-size:14px; line-height:1.6;}
.qty-row{display:flex; align-items:center; gap:14px; margin-top:6px;}
.qty-ctrl{display:flex; align-items:center; border:1.5px solid #E1DDD3; border-radius:8px;}
.qty-ctrl button{width:36px; height:36px; background:transparent; font-size:16px; font-weight:700; color:var(--gulf-blue);}
.qty-ctrl span{width:38px; text-align:center; font-weight:600; font-family:'JetBrains Mono',monospace;}

@media(max-width:720px){.pd-wrap{grid-template-columns:1fr;} .pd-img{min-height:220px;}}

/* ---------- cart / fav pages ---------- */
.cart-layout{display:grid; grid-template-columns:1.7fr 1fr; gap:24px; align-items:flex-start;}
@media(max-width:900px){.cart-layout{grid-template-columns:1fr;}}
.cart-item{
  display:flex; gap:14px; background:#fff; border-radius:10px; padding:14px; box-shadow:var(--shadow); margin-bottom:12px; align-items:center;
}
.cart-item img{width:64px; height:64px; border-radius:8px; object-fit:cover; background:var(--paper-2);}
.cart-item .ci-info{flex:1;}
.cart-item .ci-info h4{font-size:14.5px;}
.cart-item .ci-info span{font-size:12px; color:var(--steel);}
.summary-card{background:#fff; border-radius:12px; padding:22px; box-shadow:var(--shadow); position:sticky; top:96px;}
.summary-card h3{font-size:17px; margin-bottom:16px;}
.sum-row{display:flex; justify-content:space-between; font-size:14px; padding:8px 0; color:var(--steel);}
.sum-row.total{border-top:1.5px dashed #E1DDD3; margin-top:8px; padding-top:14px; font-size:18px; font-weight:700; color:var(--ink); font-family:'JetBrains Mono',monospace;}
.empty-state{text-align:center; padding:70px 20px; color:var(--steel);}
.empty-state .em-icon{font-size:44px; margin-bottom:14px;}

/* ---------- owner dashboard ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; margin-bottom:28px;}
.stat-card{background:#fff; border-radius:12px; padding:20px; box-shadow:var(--shadow); border-left:4px solid var(--gulf-orange);}
.stat-card .lbl{font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--steel); font-weight:600;}
.stat-card .val{font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; margin-top:6px; color:var(--ink);}
.stat-card .sub{font-size:12px; color:var(--success); margin-top:4px;}

.owner-tabs{display:flex; gap:8px; border-bottom:2px solid #ECE8DE; margin-bottom:22px; overflow-x:auto;}
.owner-tabs button{padding:12px 18px; font-weight:600; font-size:14px; color:var(--steel); border-bottom:2.5px solid transparent; margin-bottom:-2px; white-space:nowrap;}
.owner-tabs button.active{color:var(--gulf-blue); border-color:var(--gulf-orange);}

.table-wrap{background:#fff; border-radius:12px; box-shadow:var(--shadow); overflow-x:auto;}
table{width:100%; border-collapse:collapse; min-width:640px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--steel); padding:14px 16px; border-bottom:1.5px solid #ECE8DE; background:var(--paper);}
td{padding:12px 16px; border-bottom:1px solid #F0EDE5; font-size:13.5px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.prod-thumb{width:42px; height:42px; border-radius:6px; object-fit:cover; background:var(--paper-2);}
.badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.badge.oil{background:#e8f0fb; color:var(--gulf-blue);}
.badge.tyre{background:#fdeee3; color:var(--gulf-orange);}
.badge.spare{background:#eef7f0; color:var(--success);}
.badge.low{background:#fdeaea; color:var(--danger);}

.form-card{background:#fff; border-radius:12px; padding:24px; box-shadow:var(--shadow); margin-bottom:24px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.form-grid .span2{grid-column:1/-1;}
.img-preview{width:100%; height:130px; border-radius:8px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; overflow:hidden; margin-top:8px; border:1.5px dashed #D9D4C8;}
.img-preview img{width:100%; height:100%; object-fit:cover;}

.icon-btn{width:32px; height:32px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; background:var(--paper-2); font-size:14px;}
.icon-btn:hover{background:#E1DDD3;}
.row-actions{display:flex; gap:6px;}

/* footer */
footer{background:var(--ink); color:#A9B1BA; padding:36px 24px 24px; margin-top:60px;}
footer .fwrap{max-width:1240px; margin:0 auto; display:flex; justify-content:space-between; flex-wrap:wrap; gap:24px;}
footer h4{color:#fff; font-size:15px; margin-bottom:10px;}
footer p{font-size:13px; line-height:1.7;}
.toast{
  position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:13px 20px; border-radius:10px;
  font-size:14px; font-weight:500; box-shadow:var(--shadow-lg); z-index:400; display:flex; align-items:center; gap:10px;
  transform:translateY(20px); opacity:0; transition:.25s; pointer-events:none;
}
.toast.show{transform:translateY(0); opacity:1;}
.toast.success{border-left:4px solid var(--success);}
.toast.error{border-left:4px solid var(--danger);}
.cart-count{
  position:relative;
}
</style>
</head>

      {id:uid("p"), name:"CEAT SecuraDrive 175/70 R14 Tyre", category:"Tyres", price:4100, discount:0, stock:15, image:"", desc:"All-season tubeless tyre offering strong wet grip and a comfortable, quiet ride for sedans."},

};

function currentUser(){
  if(!state.session) return null;
  return DB.get("sba_users", []).find(u => u.phone === state.session.phone) || null;
}
function isOwner(){ const u = currentUser(); return u && u.role === "owner"; }

function cartKey(){ return "sba_cart_" + (state.session ? state.session.phone : "guest"); }
function favKey(){ return "sba_fav_" + (state.session ? state.session.phone : "guest"); }
function getCart(){ return DB.get(cartKey(), []); }
function setCart(c){ DB.set(cartKey(), c); }
function getFavs(){ return DB.get(favKey(), []); }
function setFavs(f){ DB.set(favKey(), f); }

function toast(msg, type){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + (type||"success");
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=> el.classList.remove("show"), 2600);
}

/* ---------------- validation ---------------- */
const RE = {
  name: /^[A-Za-z ]{3,40}$/,
  phone: /^[6-9]\d{9}$/,
  email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
  password: /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/
};

function validateField(id, regex, msg, val){
  const input = document.getElementById(id);
  const err = document.getElementById(id + "_err");
  if(!regex.test(val)){
    if(input) input.classList.add("invalid");
    if(err){ err.textContent = msg; err.classList.add("show"); }
    return false;
  } else {
    if(input) input.classList.remove("invalid");
    if(err) err.classList.remove("show");
    return true;
  }
}

function bindAuthEvents(){
  document.querySelectorAll(".auth-tabs button").forEach(b=>{
    b.onclick = ()=>{ state.authMode = b.dataset.mode; render(); };
  });
  const toS = document.getElementById("toSignup");
  if(toS) toS.onclick = ()=>{ state.authMode="signup"; render(); };
  const toL = document.getElementById("toLogin");
  if(toL) toL.onclick = ()=>{ state.authMode="login"; render(); };

  document.querySelectorAll(".pw-toggle").forEach(btn=>{
    btn.onclick = ()=>{
      const inp = document.getElementById(btn.dataset.target);
      if(inp.type === "password"){ inp.type="text"; btn.textContent="HIDE"; }
      else { inp.type="password"; btn.textContent="SHOW"; }
    };
  });

  const loginForm = document.getElementById("loginForm");
  if(loginForm){
    loginForm.onsubmit = (e)=>{
      e.preventDefault();
      const phone = document.getElementById("l_phone").value.trim();
      const pass = document.getElementById("l_pass").value;
      let ok = true;
      ok = validateField("l_phone", RE.phone, "Enter a valid 10-digit mobile number.", phone) && ok;
      ok = validateField("l_pass", /.+/, "Password is required.", pass) && ok;
      if(!ok) return;
      const users = DB.get("sba_users", []);
      const u = users.find(x=>x.phone===phone);
      if(!u){ showFormMsg("No account found with this phone number.", "error"); return; }
      if(u.password !== pass){ showFormMsg("Incorrect password. Please try again.", "error"); return; }
      state.session = {phone: u.phone};
      DB.set("sba_session", state.session);
      state.route = u.role === "owner" ? "owner" : "shop";
      render();
      toast("Welcome back, " + u.name.split(" ")[0] + "!", "success");
    };
  }

  const signupForm = document.getElementById("signupForm");
  if(signupForm){
    signupForm.onsubmit = (e)=>{
      e.preventDefault();
      const name = document.getElementById("s_name").value.trim();
      const phone = document.getElementById("s_phone").value.trim();
      const email = document.getElementById("s_email").value.trim();
      const area = document.getElementById("s_area").value.trim();
      const pass = document.getElementById("s_pass").value;
      const pass2 = document.getElementById("s_pass2").value;

      let ok = true;
      ok = validateField("s_name", RE.name, "Name must be 3-40 letters (no numbers).", name) && ok;
      ok = validateField("s_phone", RE.phone, "Enter a valid 10-digit Indian mobile number.", phone) && ok;
      ok = validateField("s_email", RE.email, "Enter a valid email address.", email) && ok;
      ok = validateField("s_area", /^.{2,60}$/, "Please enter your delivery area/town.", area) && ok;
      ok = validateField("s_pass", RE.password, "Password needs upper, lower, number &amp; symbol (min 8).", pass) && ok;
      ok = validateField("s_pass2", new RegExp("^" + pass.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + "$"), "Passwords do not match.", pass2) && ok;
      if(!ok) return;

      const users = DB.get("sba_users", []);
      if(users.some(u=>u.phone===phone)){
        showFormMsg("An account with this phone number already exists. Please log in.", "error");
        return;
      }
      if(users.some(u=>u.email.toLowerCase()===email.toLowerCase())){
        showFormMsg("An account with this email already exists.", "error");
        return;
      }
      const role = phone === OWNER_PHONE ? "owner" : "customer";
      const newUser = {id: uid("u"), name, phone, email, area, password: pass, role, joined: new Date().toISOString()};
      users.push(newUser);
      DB.set("sba_users", users);
      state.session = {phone};
      DB.set("sba_session", state.session);
      state.route = role === "owner" ? "owner" : "shop";
      render();
      toast(role==="owner" ? "Owner account created. Welcome, " + name.split(" ")[0] + "!" : "Account created! Welcome to Sri Pavan Agencies.", "success");
    };
  }
}

/* ================= CART ================= */
function renderCart(){
  const cart = getCart();
  const products = DB.get("sba_products",[]);
  const items = cart.map(ci=>{
    const p = products.find(x=>x.id===ci.id);
    return p ? {...p, qty: ci.qty} : null;
  }).filter(Boolean);

  const subtotal = items.reduce((s,i)=> s + i.price*i.qty, 0);
  const discountTotal = items.reduce((s,i)=> s + (i.price*i.discount/100)*i.qty, 0);
  const grandTotal = subtotal - discountTotal;

  if(!items.length){
    return `<div class="page"><div class="empty-state"><div class="em-icon">🛒</div><h3>Your cart is empty</h3><p>Add some products to get started.</p><br><button class="btn btn-primary" id="goShop">Browse Products</button></div></div>`;
  }

  return `
  <div class="page">
    <div class="page-head"><div><div class="eyebrow">Checkout</div><h2>Your Cart</h2><p>${items.length} item${items.length>1?'s':''} in cart</p></div></div>
    <div class="cart-layout">
      <div>
        ${items.map(i=>`
          <div class="cart-item">
            <img src="${i.image||placeholderImg(i.category)}">
            <div class="ci-info">
              <h4>${i.name}</h4>
              <span>₹${Math.round(i.price*(1-i.discount/100))} × ${i.qty} ${i.discount>0?`&nbsp;•&nbsp;-${i.discount}% off`:''}</span>
            </div>
            <div class="qty-ctrl">
              <button data-cartminus="${i.id}">−</button><span>${i.qty}</span><button data-cartplus="${i.id}">+</button>
            </div>
            <button class="icon-btn" data-cartremove="${i.id}">🗑</button>
          </div>
        `).join("")}
      </div>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="sum-row"><span>Subtotal</span><span class="mono">₹${subtotal.toFixed(0)}</span></div>
        <div class="sum-row"><span>Discount</span><span class="mono" style="color:var(--success)">-₹${discountTotal.toFixed(0)}</span></div>
        <div class="sum-row total"><span>Total</span><span>₹${grandTotal.toFixed(0)}</span></div>
        <button class="btn btn-primary btn-block" style="margin-top:16px;" id="checkoutBtn">Place Order</button>
      </div>
    </div>
  </div>`;
}

        <td>${new Date(o.date).toLocaleDateString()} ${new Date(o.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
        <td>${o.items.map(i=>i.name+' ×'+i.qty).join(", ")}</td>
        <td class="mono">₹${o.total.toFixed(0)}</td>
      </tr>`).join("")}
      </tbody>
    </table></div>
  </div>`;
}

/* ================= OWNER DASHBOARD ================= */
function renderOwner(){
  const tabs = [["dashboard","Dashboard"],["products","Products"],["reports","Reports"],["customers","Customers"]];
  return `<div class="page">
    <div class="page-head"><div><div class="eyebrow">Owner Console</div><h2>Store Management</h2><p>Manage products, prices, discounts and view sales performance.</p></div></div>
    <div class="owner-tabs">${tabs.map(([k,l])=>`<button data-otab="${k}" class="${state.ownerTab===k?'active':''}">${l}</button>`).join("")}</div>
    <div id="ownerTabBody">${renderOwnerTab()}</div>
  </div>`;
}

function renderOwnerTab(){
  if(state.ownerTab==="dashboard") return renderOwnerDashboard();
  if(state.ownerTab==="products") return renderOwnerProducts();
  if(state.ownerTab==="reports") return renderOwnerReports();
  if(state.ownerTab==="customers") return renderOwnerCustomers();
}

function renderOwnerDashboard(){
  const products = DB.get("sba_products",[]);
  const orders = DB.get("sba_orders",[]);
  const users = DB.get("sba_users",[]).filter(u=>u.role==="customer");
  const revenue = orders.reduce((s,o)=>s+o.total,0);
  const lowStock = products.filter(p=>p.stock<10);
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="lbl">Total Revenue</div><div class="val">₹${revenue.toFixed(0)}</div><div class="sub">${orders.length} orders placed</div></div>
    <div class="stat-card"><div class="lbl">Products Listed</div><div class="val">${products.length}</div><div class="sub">${lowStock.length} low on stock</div></div>
    <div class="stat-card"><div class="lbl">Registered Customers</div><div class="val">${users.length}</div><div class="sub">Growing steadily</div></div>
    <div class="stat-card"><div class="lbl">Avg. Order Value</div><div class="val">₹${orders.length?Math.round(revenue/orders.length):0}</div><div class="sub">Per transaction</div></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Recent Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Date</th></tr></thead>
      <tbody>
      ${orders.slice(-6).reverse().map(o=>`
        <tr><td class="mono">${o.id}</td><td>${o.customerName}</td><td>${o.items.length} item(s)</td><td class="mono">₹${o.total.toFixed(0)}</td><td>${new Date(o.date).toLocaleDateString()}</td></tr>
      `).join("") || `<tr><td colspan="5" style="text-align:center; color:var(--steel); padding:30px;">No orders yet.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

  <div class="form-card">
    <h3 style="margin-bottom:16px;">${editData?'Edit Product':'Add New Product'}</h3>
    <form id="productForm">
      <div class="form-grid">
        <div class="field"><label>Product Name</label><input id="pf_name" value="${editData?editData.name:''}" placeholder="e.g. Gulf Pride 20W40 (1L)"><div class="err" id="pf_name_err"></div></div>
        <div class="field"><label>Category</label>
          <select id="pf_category">
            ${["Engine Oil","Tyres","Spare Parts"].map(c=>`<option ${editData&&editData.category===c?'selected':''}>${c}</option>`).join("")}

        </div>

        <div class="field"><label>Discount (%)</label><input id="pf_discount" type="number" min="0" max="90" value="${editData?editData.discount:0}" placeholder="0"><div class="err" id="pf_discount_err"></div></div>
        <div class="field"><label>Stock Quantity</label><input id="pf_stock" type="number" min="0" value="${editData?editData.stock:''}" placeholder="e.g. 40"><div class="err" id="pf_stock_err"></div></div>
        <div class="field"><label>Image URL (optional)</label><input id="pf_image" value="${editData&&editData.image?editData.image:''}" placeholder="https://... (leave blank for default icon)"></div>
        <div class="field span2"><label>Description</label><textarea id="pf_desc" rows="3" placeholder="Full product details for customers">${editData?editData.desc:''}</textarea><div class="err" id="pf_desc_err"></div></div>
        <div class="field span2">
          <label>Image Preview</label>
          <div class="img-preview" id="imgPreview"><img src="${editData?(editData.image||placeholderImg(editData.category)):placeholderImg('Engine Oil')}"></div>
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-primary" type="submit">${editData?'Save Changes':'Add Product'}</button>
        ${editData?`<button class="btn btn-ghost" type="button" id="cancelEdit">Cancel</button>`:''}
      </div>
    </form>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Discount</th><th>Stock</th><th>Actions</th></tr></thead>
      <tbody>
      ${products.map(p=>`
        <tr>
          <td style="display:flex; align-items:center; gap:10px;"><img class="prod-thumb" src="${p.image||placeholderImg(p.category)}">${p.name}</td>
          <td><span class="badge ${p.category==='Engine Oil'?'oil':p.category==='Tyres'?'tyre':'spare'}">${p.category}</span></td>
          <td class="mono">₹${p.price}</td>
          <td class="mono">${p.discount}%</td>
          <td>${p.stock<10?`<span class="badge low">${p.stock} left</span>`:p.stock}</td>
          <td class="row-actions">
            <button class="icon-btn" data-editprod="${p.id}">✎</button>
            <button class="icon-btn" data-delprod="${p.id}">🗑</button>
          </td>
        </tr>
      `).join("")}
      </tbody>
    </table>
  </div>`;
}

function renderOwnerReports(){
  const orders = DB.get("sba_orders",[]);
  const products = DB.get("sba_products",[]);
  const revenue = orders.reduce((s,o)=>s+o.total,0);

  const salesByProduct = {};
  orders.forEach(o=> o.items.forEach(i=>{
    salesByProduct[i.name] = (salesByProduct[i.name]||0) + i.qty;
  }));
  const top = Object.entries(salesByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const salesByCat = {"Engine Oil":0,"Tyres":0,"Spare Parts":0};
  orders.forEach(o=> o.items.forEach(i=>{
    const p = products.find(x=>x.id===i.id);
    if(p) salesByCat[p.category] = (salesByCat[p.category]||0) + i.price*i.qty*(1-i.discount/100);
  }));

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="lbl">Total Revenue</div><div class="val">₹${revenue.toFixed(0)}</div></div>
    <div class="stat-card"><div class="lbl">Orders Fulfilled</div><div class="val">${orders.length}</div></div>
    <div class="stat-card"><div class="lbl">Engine Oil Sales</div><div class="val">₹${salesByCat["Engine Oil"].toFixed(0)}</div></div>
    <div class="stat-card"><div class="lbl">Tyres + Parts Sales</div><div class="val">₹${(salesByCat["Tyres"]+salesByCat["Spare Parts"]).toFixed(0)}</div></div>
  </div>
  <div class="table-wrap" style="margin-bottom:24px;">
    <table>
      <thead><tr><th>Top Selling Products</th><th>Units Sold</th></tr></thead>
      <tbody>
      ${top.length?top.map(([name,qty])=>`<tr><td>${name}</td><td class="mono">${qty}</td></tr>`).join(""):`<tr><td colspan="2" style="text-align:center; color:var(--steel); padding:30px;">No sales recorded yet.</td></tr>`}
      </tbody>
    </table>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Order ID</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Date</th></tr></thead>
      <tbody>
      ${orders.slice().reverse().map(o=>`
        <tr><td class="mono">${o.id}</td><td>${o.customerName}</td><td class="mono">${o.phone}</td><td>${o.items.map(i=>i.name+' ×'+i.qty).join(", ")}</td><td class="mono">₹${o.total.toFixed(0)}</td><td>${new Date(o.date).toLocaleDateString()}</td></tr>
      `).join("") || `<tr><td colspan="6" style="text-align:center; color:var(--steel); padding:30px;">No orders yet.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

function renderOwnerCustomers(){
  const users = DB.get("sba_users",[]).filter(u=>u.role==="customer");
  const orders = DB.get("sba_orders",[]);
  return `
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Area</th><th>Orders</th><th>Joined</th></tr></thead>
      <tbody>
      ${users.map(u=>`
        <tr><td>${u.name}</td><td class="mono">${u.phone}</td><td>${u.email}</td><td>${u.area||'—'}</td><td>${orders.filter(o=>o.phone===u.phone).length}</td><td>${new Date(u.joined).toLocaleDateString()}</td></tr>
      `).join("") || `<tr><td colspan="6" style="text-align:center; color:var(--steel); padding:30px;">No customers registered yet.</td></tr>`}

}

/* ================= EVENT BINDINGS ================= */
function bindPageEvents(){
  // shop
  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.oninput = (e)=>{ state.search = e.target.value; renderPageBody(); searchInput.focus(); searchInput.setSelectionRange(searchInput.value.length,searchInput.value.length); };
  }
  document.querySelectorAll("[data-cat]").forEach(b=>{ b.onclick = ()=>{ state.category=b.dataset.cat; renderPageBody(); }; });
  document.querySelectorAll("[data-open]").forEach(el=>{ el.onclick = ()=>{ state.activeProductModal = el.dataset.open; refreshModal(); }; });
  document.querySelectorAll("[data-fav]").forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); toggleFav(el.dataset.fav); }; });
  document.querySelectorAll("[data-addcart]").forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); addToCart(el.dataset.addcart,1); }; });
  const goShop = document.getElementById("goShop"); if(goShop) goShop.onclick = ()=>{ state.route="shop"; render(); };

  // cart
  document.querySelectorAll("[data-cartplus]").forEach(el=>{ el.onclick = ()=> changeCartQty(el.dataset.cartplus, 1); });
  document.querySelectorAll("[data-cartminus]").forEach(el=>{ el.onclick = ()=> changeCartQty(el.dataset.cartminus, -1); });
  document.querySelectorAll("[data-cartremove]").forEach(el=>{ el.onclick = ()=> removeFromCart(el.dataset.cartremove); });
  const checkoutBtn = document.getElementById("checkoutBtn");
  if(checkoutBtn) checkoutBtn.onclick = placeOrder;

  // owner tabs
  document.querySelectorAll("[data-otab]").forEach(b=>{ b.onclick = ()=>{ state.ownerTab=b.dataset.otab; state.editingProduct=null; renderOwner_refresh(); }; });
  document.querySelectorAll("[data-editprod]").forEach(b=>{ b.onclick = ()=>{ state.editingProduct=b.dataset.editprod; renderOwner_refresh(); window.scrollTo({top:0,behavior:'smooth'}); }; });
  document.querySelectorAll("[data-delprod]").forEach(b=>{ b.onclick = ()=> deleteProduct(b.dataset.delprod); });
  const cancelEdit = document.getElementById("cancelEdit"); if(cancelEdit) cancelEdit.onclick = ()=>{ state.editingProduct=null; renderOwner_refresh(); };

  const pfCategory = document.getElementById("pf_category");
  const pfImage = document.getElementById("pf_image");
  function refreshPreview(){
    const preview = document.getElementById("imgPreview");
    if(!preview) return;
    const url = pfImage.value.trim();
    preview.innerHTML = `<img src="${url || placeholderImg(pfCategory.value)}" onerror="this.src='${placeholderImg(pfCategory.value)}'">`;
  }
  if(pfCategory) pfCategory.onchange = refreshPreview;
  if(pfImage) pfImage.oninput = refreshPreview;

  const productForm = document.getElementById("productForm");
  if(productForm) productForm.onsubmit = handleProductForm;

  // modal
  const overlay = document.getElementById("pdOverlay");
  if(overlay){
    overlay.onclick = (e)=>{ if(e.target.id==="pdOverlay"){ state.activeProductModal=null; refreshModal(); } };
  }
  const pdClose = document.getElementById("pdClose"); if(pdClose) pdClose.onclick = ()=>{ state.activeProductModal=null; refreshModal(); };
  bindModalQty();
}

function bindModalQty(){
  const plus = document.getElementById("pdPlus"), minus = document.getElementById("pdMinus"), qtyEl = document.getElementById("pdQty");
  if(!plus) return;
  let qty = 1;
  plus.onclick = ()=>{ qty++; qtyEl.textContent=qty; };
  minus.onclick = ()=>{ if(qty>1){ qty--; qtyEl.textContent=qty; } };
  document.getElementById("pdAddCart").onclick = ()=>{ addToCart(state.activeProductModal, qty); };
  document.getElementById("pdFav").onclick = ()=>{ toggleFav(state.activeProductModal); refreshModal(); };
}

function refreshModal(){
  const holder = document.getElementById("pdOverlay");
  if(holder) holder.outerHTML = renderProductModal();
  bindModalQty();
  const overlay = document.getElementById("pdOverlay");
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==="pdOverlay"){ state.activeProductModal=null; refreshModal(); } };
  const pdClose = document.getElementById("pdClose"); if(pdClose) pdClose.onclick = ()=>{ state.activeProductModal=null; refreshModal(); };
  // refresh underlying grid fav state too
  const navBadgeArea = document.getElementById("navlinks");
  if(navBadgeArea) navBadgeArea.outerHTML = renderShellNavOnly();
  rebindNav();
}

function renderShellNavOnly(){
  const u = currentUser(); const owner = u && u.role==="owner";
  const cartCount = getCart().reduce((s,i)=>s+i.qty,0);
  return `<div class="navlinks" id="navlinks">
      ${owner ? `
        <button data-route="owner" class="${state.route==='owner'?'active':''}">Owner Dashboard</button>
        <button data-route="profile" class="${state.route==='profile'?'active':''}">Profile</button>
      ` : `
        <button data-route="shop" class="${state.route==='shop'?'active':''}">Shop</button>
        <button data-route="cart" class="${state.route==='cart'?'active':''}">Cart${cartCount?`<span class="nav-badge">${cartCount}</span>`:''}</button>
        <button data-route="favorites" class="${state.route==='favorites'?'active':''}">Favourites</button>
        <button data-route="orders" class="${state.route==='orders'?'active':''}">My Orders</button>
        <button data-route="profile" class="${state.route==='profile'?'active':''}">Profile</button>
      `}
    </div>`;
}
function rebindNav(){
  document.querySelectorAll("#navlinks button").forEach(b=>{
    b.onclick = ()=>{ state.route = b.dataset.route; state.ownerTab="dashboard"; render(); };
  });
}

function renderOwner_refresh(){
  const body = document.getElementById("ownerTabBody");
  if(body){ body.innerHTML = renderOwnerTab(); bindPageEvents(); }
}

/* ---- actions ---- */
function toggleFav(id){
  let favs = getFavs();
  if(favs.includes(id)){ favs = favs.filter(f=>f!==id); toast("Removed from favourites","success"); }
  else { favs.push(id); toast("Added to favourites","success"); }
  setFavs(favs);
  renderPageBody();
}

function addToCart(id, qty){
  const products = DB.get("sba_products",[]);
  const p = products.find(x=>x.id===id);
  if(!p || p.stock<1){ toast("This product is out of stock","error"); return; }
  let cart = getCart();
  const existing = cart.find(c=>c.id===id);
  if(existing){ existing.qty = Math.min(existing.qty+qty, p.stock); }
  else { cart.push({id, qty: Math.min(qty,p.stock)}); }
  setCart(cart);
  toast(p.name + " added to cart","success");
  renderShellSoft();
}

function changeCartQty(id, delta){
  const products = DB.get("sba_products",[]);
  const p = products.find(x=>x.id===id);
  let cart = getCart();
  const item = cart.find(c=>c.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(c=>c.id!==id); }
  else if(p && item.qty > p.stock){ item.qty = p.stock; }
  setCart(cart);
  renderShellSoft();
}

function removeFromCart(id){
  setCart(getCart().filter(c=>c.id!==id));
  toast("Removed from cart","success");
  renderShellSoft();
}

function placeOrder(){
  const u = currentUser();
  const cart = getCart();
  const products = DB.get("sba_products",[]);
  if(!cart.length) return;
  const items = cart.map(ci=>{
    const p = products.find(x=>x.id===ci.id);
    return {id:p.id, name:p.name, qty:ci.qty, price:p.price, discount:p.discount};
  });
  const total = items.reduce((s,i)=> s + i.price*i.qty*(1-i.discount/100), 0);
  const order = {id: uid("ORD"), phone:u.phone, customerName:u.name, items, total, date: new Date().toISOString()};
  const orders = DB.get("sba_orders",[]);
  orders.push(order);
  DB.set("sba_orders", orders);

  // reduce stock
  const allProducts = DB.get("sba_products",[]);
  items.forEach(i=>{
    const p = allProducts.find(x=>x.id===i.id);
    if(p) p.stock = Math.max(0, p.stock - i.qty);
  });
  DB.set("sba_products", allProducts);

  setCart([]);
  toast("Order placed successfully! Total ₹" + total.toFixed(0), "success");
  state.route = "orders";
  render();
}

function renderShellSoft(){
  // re-render nav badge + current page body without full remount flicker
  const navArea = document.getElementById("navlinks");
  if(navArea){ navArea.outerHTML = renderShellNavOnly(); rebindNav(); }
  renderPageBody();
}

/* ---- owner product CRUD ---- */
function handleProductForm(e){
  e.preventDefault();
  const name = document.getElementById("pf_name").value.trim();
  const category = document.getElementById("pf_category").value;
  const price = document.getElementById("pf_price").value;
  const discount = document.getElementById("pf_discount").value || "0";
  const stock = document.getElementById("pf_stock").value;
  const image = document.getElementById("pf_image").value.trim();
  const desc = document.getElementById("pf_desc").value.trim();

  let ok = true;
  ok = validateField("pf_name", /^.{3,80}$/, "Product name must be 3-80 characters.", name) && ok;
  ok = validateField("pf_price", /^[1-9]\d*$/, "Enter a valid price greater than 0.", price) && ok;
  ok = validateField("pf_discount", /^([0-9]|[1-8][0-9]|90)$/, "Discount must be between 0 and 90.", discount) && ok;
  ok = validateField("pf_stock", /^\d+$/, "Enter a valid stock quantity (0 or more).", stock) && ok;
  ok = validateField("pf_desc", /^.{10,500}$/, "Description should be at least 10 characters.", desc) && ok;
  if(!ok) return;

  const products = DB.get("sba_products",[]);
  if(state.editingProduct){
    const p = products.find(x=>x.id===state.editingProduct);
    Object.assign(p, {name, category, price:+price, discount:+discount, stock:+stock, image, desc});
    toast("Product updated","success");
    state.editingProduct = null;
  } else {
    products.push({id:uid("p"), name, category, price:+price, discount:+discount, stock:+stock, image, desc});
    toast("Product added to catalogue","success");
  }
  DB.set("sba_products", products);
  renderOwner_refresh();
}

function deleteProduct(id){
  if(!confirm("Delete this product? This cannot be undone.")) return;
  DB.set("sba_products", DB.get("sba_products",[]).filter(p=>p.id!==id));
  toast("Product deleted","success");
  renderOwner_refresh();
}

/* ---------------- init ---------------- */
render();
</script>
